name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: test
        run: cargo test --workspace --locked
      - name: guest image labels
        run: |
          set -euo pipefail
          grep -q 'berthos.guest.version="v1"' images/linux-desktop/Dockerfile
          grep -q 'berthos.desktop="xvfb-openbox-chromium"' images/linux-desktop/Dockerfile
          grep -q 'berthos.egress.policy="default-deny"' images/linux-desktop/Dockerfile
      - name: doctor fail-closed smoke
        run: |
          set -euo pipefail
          cargo build -p berthos-cli --locked
          bin=./target/debug/berth
          if "$bin" doctor --simulate laptop; then
            echo "expected laptop to fail closed" >&2
            exit 1
          fi
          if "$bin" doctor --simulate missing-image; then
            echo "expected missing-image to fail closed" >&2
            exit 1
          fi
          if "$bin" doctor --simulate bind-all; then
            echo "expected bind-all to fail closed" >&2
            exit 1
          fi
          # Doctor exits 1 when ineligible (correct). Capture JSON separately so
          # pipefail does not treat that exit as a CI failure.
          set +e
          "$bin" doctor --simulate laptop --json > /tmp/berthos-doctor.json
          doctor_exit=$?
          set -e
          if [ "$doctor_exit" -eq 0 ]; then
            echo "expected laptop --json to exit 1" >&2
            exit 1
          fi
          grep -q '"eligible": false' /tmp/berthos-doctor.json
          grep -q '"ok": false' /tmp/berthos-doctor.json
          grep -q '"class": "laptop"' /tmp/berthos-doctor.json

  docker-live:
    name: docker-live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
      - name: docker available
        run: docker info
      - name: build labeled guest image
        run: docker build -t berthos-linux-desktop:v1 images/linux-desktop
      - name: image label contract
        run: |
          set -euo pipefail
          labels=$(docker image inspect berthos-linux-desktop:v1 --format '{{json .Config.Labels}}')
          echo "$labels"
          echo "$labels" | grep -q '"berthos.guest.version":"v1"'
          echo "$labels" | grep -q '"berthos.desktop":"xvfb-openbox-chromium"'
          echo "$labels" | grep -q '"berthos.egress.policy":"default-deny"'
      - name: live doctor
        run: |
          set -euo pipefail
          cargo build -p berthos-cli --locked
          ./target/debug/berth doctor --json | tee /tmp/berthos-live-doctor.json
          grep -q '"ok": true' /tmp/berthos-live-doctor.json
          grep -q '"eligible": true' /tmp/berthos-live-doctor.json
          grep -q '"class": "vm-guest"' /tmp/berthos-live-doctor.json
          grep -q 'berthos.guest.version' /tmp/berthos-live-doctor.json
          grep -q 'timestamp' /tmp/berthos-live-doctor.json
      - name: live tests
        run: cargo test --workspace --locked
